name: Nachos CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make python3 ed csh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ensure ed and tcsh/csh are present
          which ed || brew install ed
          which csh || true

      - name: Clean & Build Nachos
        run: |
          make -C code clean
          make -C code

      - name: Run Automated Test Suite
        run: |
          python3 code/test_runner.py --verbose
